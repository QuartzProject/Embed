name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      quartz-ref: ${{ steps.quartz.outputs.quartz-ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Pick the Quartz release
        id: quartz
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/plan-quartz.sh

  gradle:
    name: Gradle
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: QuartzProject/Quartz
          ref: ${{ needs.plan.outputs.quartz-ref }}
          path: .deps/quartz

      - name: Fetch the Quartz release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/fetch-quartz.sh "${{ needs.plan.outputs.quartz-ref }}"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Build and test
        run: ./gradlew build "-Pquartz.jvm=$PWD/.deps/quartz/bindings/jvm" "-Pquartz.library=$QUARTZ_LIBRARY"

  cmake:
    name: CMake example
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the Quartz release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/fetch-quartz.sh "${{ needs.plan.outputs.quartz-ref }}"

      - name: Install the compiler
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get install -y --no-install-recommends g++-15
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 23
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Build the example
        run: |
          cmake -S examples/cmake-hello -B build/hello -G Ninja -DCMAKE_C_COMPILER=clang-23 \
            -DCMAKE_CXX_COMPILER=clang++-23 "-DCMAKE_PREFIX_PATH=$QUARTZ_DIST"
          cmake --build build/hello

      - name: Run the tool
        run: build/hello/qwc examples/cmake-hello/wc.qz
